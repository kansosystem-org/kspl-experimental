<!-- The menu bar's Style, Table and Insert menus.
     **This is not a page of its own.** `page.html` names it, and `bundle.kspls` puts it
     in where that name stands, so the order on the band is the order the name sits in.
     Caution: **Take a whole menu, never half of one**, or the rest of the bar comes between its
     halves ("Files near the limit and how they split" in [`../../README.md`](../../README.md)). -->
  <details class="menu" data-edit><summary>Style</summary>
    <div class="items">
      <!-- **Keep the first row short**: "what it takes effect on" alone (the 400px cap).
           Caution: **Do not write the rows and the choices here** — they are the document's own
           styles and colours, made by `form.js` from the core (the rows are `fly.js`'s). -->
      <div id="form-picks"></div>
      <hr>
      <!-- **Keep it folded** (open, the style fields cover the canvas). -->
      <details class="sub"><summary>The styles in detail</summary>
      <div class="items">
      <div class="row">
        <div id="style-pick"></div>
        <input id="style-family" type="text" size="10" placeholder="font name">
      </div>
      <div class="row">
        <input id="style-size" type="number" min="1" step="1" placeholder="size">
        <input id="style-weight" type="number" min="1" max="1000" step="100" placeholder="weight">
        <div id="style-italic"></div>
      </div>
      <!-- Caution: **A colour must be able to hold "unset"** (inheriting from the parent). An
           `<input type="color">` cannot be empty, so the mark beside it holds that. -->
      <div class="row">
        <label><input id="style-has-color" type="checkbox"> Text colour</label>
        <input id="style-color" type="color" value="#000000">
        <label><input id="style-has-back" type="checkbox"> Highlight colour</label>
        <input id="style-back" type="color" value="#ffff00">
      </div>
      <!-- It takes effect on an expression's answer alone (text typed bare stays as typed). -->
      <div class="row">
        <label><input id="style-grouped" type="checkbox"> Group digits</label>
        <label><input id="style-percent" type="checkbox"> %</label>
      </div>
      <div class="row">
        <label><input id="style-has-places" type="checkbox"> Decimals</label>
        <input id="style-places" type="number" min="0" max="9" step="1" size="2">
        <input id="style-prefix" type="text" size="3" placeholder="before">
        <input id="style-suffix" type="text" size="3" placeholder="after">
        <!-- Shown as a date, the number's dressing does not take effect; the value, typed too, is
             the count of days from 1970-01-01. -->
        <div id="style-dated"></div>
      </div>
      <!-- An empty line-height multiple means "unset" (the font's own). -->
      <div class="row">
        <div id="style-align"></div>
        <!-- Caution: **Put the unit in the name.** A bare number is taken for CSS's `line-height`
             (on the type's size) and opens wider; it hangs on **one line's height**. -->
        <input id="style-lead" type="number" min="0.5" max="4" step="0.05" size="4"
          placeholder="leading (lines)" title="The leading in units of one line (1 = 1 line, 1.5 = 1.5 lines)">
        <input id="style-indent" type="number" step="4" size="3" placeholder="indent">
        <!-- Take it off and what runs past the level's width sticks out (a code block is
             that). Whitespace does not drop either. -->
        <label><input id="style-wrap" type="checkbox" checked>Wrap</label>
        <!-- **A one-off page break is a style too** (a "page-break" style hung on).
             It does not take effect on a document not split into pages. -->
        <label><input id="style-breaks" type="checkbox">Break the page before this paragraph</label>

      </div>
      <!-- **There is no section break.** One block of this style is one set of columns over its
           children; one column means none. -->
      <div class="row">
        <input id="style-columns" type="number" min="1" max="8" step="1" size="2"
          placeholder="columns">
        <input id="style-column-gap" type="number" min="0" step="4" size="3" placeholder="column gap">
        <!-- The space inside the fill and the line, apart from the line-height multiple. -->
        <input id="style-pad" type="number" min="0" step="2" size="3" placeholder="inner space">
      </div>
      <!-- Empty is "as the parent"; "do not draw" is a setting. -->
      <div class="row">
        <div id="style-underline"></div>
        <div id="style-strike"></div>
      </div>
      <!-- A running number alone wants text in front too (the "Fig. " of "Fig. 1."). -->
      <div class="row">
        <div id="style-mark"></div>
        <input id="style-mark-before" type="text" size="3" placeholder="before the number">
        <input id="style-mark-text" type="text" size="4" placeholder="after the mark or number">
      </div>
      <!-- The heading's depth and how it gathers: the contents, the footnote list and a chart
           hold no content in the document (each is assembled on placing). -->
      <div class="row">
        <label for="style-outline">Heading</label>
        <input id="style-outline" type="number" min="0" max="6" step="1" size="2"
          placeholder="depth">
        <!-- **A depth of 0 is no substitute** — 0 is "not a heading", gone from the list. -->
        <div id="style-in-chapters" title="Taken off, it enters neither the contents nor the chapter numbering. It stays in the headings' list"></div>
        <div id="style-collect"></div>
      </div>
      <!-- A line disappears at a thickness of 0; a table's grid is a line on `cell`. -->
      <div class="row">
        <input id="style-edge" type="number" min="0" max="8" step="1" size="2"
          placeholder="line">
        <input id="style-edge-color" type="color" value="#808080">
        <label><input id="style-has-fill" type="checkbox"> Fill</label>
        <input id="style-fill" type="color" value="#eeeeee">
        <!-- A line and an arrow are not filled; a diagonal, it needs a frame (a slide's). -->
        <div id="style-shape"></div>
      </div>
      <!-- A conditional style: only the style's name is layered (its colour and weight are that
           style's). Text that cannot be read as a number does not match. -->
      <div class="row">
        <label for="style-when">When the value</label>
        <div id="style-when"></div>
        <input id="style-when-than" type="number" step="1" size="4" placeholder="number">
        <label for="style-when-then">then</label>
        <div id="style-when-then"></div>
      </div>
      <button id="style-apply" type="button">Change</button>
      <hr>
      <div class="row">
        <input id="style-name" type="text" size="8" placeholder="new style name">
        <button id="style-new" type="button">Make</button>
      </div>
      </div>
      </details>
    </div>
  </details>
  <!-- It takes effect only with the cursor in a table; what is added goes behind the cursor. -->
  <details class="menu" data-edit><summary>Table</summary>
    <div class="items">
      <!-- Caution: **Do not put the commonly used commands out here again** — the ribbon holds the
           one-press way (`ribbon.js`, pressing the same button). -->
      <div data-fly="Rows and columns" id="table-lines-fly">
        <div class="row">
          <button id="add-row" type="button">Insert a row</button>
          <button id="drop-row" type="button">Delete the row</button>
        </div>
        <div class="row">
          <button id="add-col" type="button">Insert a column</button>
          <button id="drop-col" type="button">Delete the column</button>
        </div>
      </div>
      <!-- **Drag across the cells first, then press once** (Excel's way). -->
      <div data-fly="Merge" id="table-merge-fly">
        <div class="row">
          <button id="merge-cells" type="button">Merge the selected cells</button>
          <button id="split-cell" type="button">Unmerge cells</button>
        </div>
      </div>
      <!-- Autofill: a position inside an expression shifts (only the side carrying a $ stays). -->
      <div data-fly="Copy" id="table-fill-fly">
        <div class="row">
          <button id="fill-down" type="button">Copy downward</button>
          <button id="fill-right" type="button">Copy rightward</button>
        </div>
      </div>
      <!-- **Both live in the one panel the heading's arrow opens** (`#narrow` in `page.html`). -->
      <div class="row">
        <button id="narrow-here" type="button" title="Opens the panel that orders and narrows the column the cursor is in">Order and narrow this column</button>
        <button id="filter-clear" type="button">Show all rows of this table</button>
      </div>

    </div>
  </details>
  <!-- What is put in goes behind the cursor's paragraph, not inside a table's cell.
       **Take the name from the other products** ("Insert"), a noun in sentence case.
       **Do not line fields up on the first row**, only the name of the thing put in (the 400px
       cap is watched by `kspage/tests/browser/menu.js`). -->
  <details class="menu" data-edit><summary>Insert</summary>
    <div class="items">
      <!-- Caution: **Do not lean on the style's name too far** — renamed, the style is still found
           **by role** (`role_of` in `../../write/insert.kspls`). -->
      <div data-fly="Table" id="put-table-fly">
        <!-- The size is chosen on a grid (Word's shape; `fly.js`'s `kspageGridPick`). Pressing a
             cell inserts at that size; the button below inserts at the size landed.
             **Columns are said first** ("4 × 3" is four across). -->
        <div class="note">Point at the size and press it (columns × rows)</div>
        <div id="table-picks"></div>
        <button id="put-table" type="button">Insert a table</button>
        <!-- Each cell goes in as it is (starting with `=` it becomes an expression). -->
        <button id="open-csv" type="button">Insert from CSV</button>
      </div>
      <!-- The rows are made by `command.js`; a template only assembles the frames. -->
      <div data-fly="Slide" id="put-slide-fly">
        <div id="slide-picks"></div>
        <button id="put-slide" type="button">Insert a slide</button>
        <button id="drop-frame" type="button">Delete the selected frame</button>
      </div>
      <!-- **What the document holds is the source alone**; a file read becomes data: text.
           Caution: **Do not make the URL field one more level of set** — a level with only one
           thing to fold adds a step with nothing to hide. -->
      <div data-fly="Image" id="put-image-fly">
        <div class="row">
          <button id="pick-image" type="button">Insert from a file</button>
          <input id="image-file" type="file" accept="image/*" hidden>
        </div>
        <!-- Leave the size empty and it reads it in and puts it in at its own size. -->
        <div class="row">
          <input id="image-src" type="text" size="10" placeholder="the image's place (a URL or data:)">
          <input id="image-w" type="number" min="0" step="10" size="3" placeholder="width">
          <input id="image-h" type="number" min="0" step="10" size="3" placeholder="height">
          <button id="put-image" type="button">Insert</button>
        </div>
      </div>
      <!-- **What the document holds is the range alone**; the height is the style's. The kinds'
           rows are made by `command.js` (the texts are names the core knows). -->
      <div data-fly="Chart" id="put-chart-fly">
        <div class="row">
          <input id="chart-range" type="text" size="12" placeholder="range (Detail!A1:A3)">
        </div>
        <div id="chart-picks"></div>
        <button id="put-chart" type="button">Insert a chart</button>
      </div>

      <!-- **One style per shape holds its colour and thickness.** The ribbon holds the common
           shapes; this chooses from all.
           Caution: **Write the settlement where it is seen**, not only in a notice after a press.
           **The name and the reference from the body share a set** (both point by name). -->
      <div data-fly="Shape" id="put-shape-fly">
        <div class="note">Where you clicked (a slide, a paragraph, a cell) holds it</div>
        <div id="shape-picks"></div>
        <button id="put-shape" type="button">Insert a shape</button>
        <!-- Caution: **Do not write "the frame's name"** — it names tables and paragraphs too
             (`named_at` in `../../write/block.kspls`). -->
        <div class="row">
          <input id="frame-name" type="text" size="8" placeholder="the name to attach here"
            title="The name attaches where you clicked (inside a cell, the table; inside a slide's frame, the frame; otherwise the paragraph)">
          <button id="frame-name-apply" type="button">Set the name</button>
        </div>
        <!-- Only a paragraph carrying a running number can be called (attach a name above). -->
        <div class="row">
          <input id="refer-to" type="text" size="8" placeholder="the name called">
          <button id="put-refer" type="button">Call it from the body</button>
        </div>
      </div>
      <!-- The dressing puts the link's look on, so taken off it goes back to "as the parent". -->
      <div data-fly="Link" id="put-link-fly">
        <div class="row">
          <input id="href" type="text" size="14" placeholder="the link's target">
          <button id="link-apply" type="button">Attach</button>
          <button id="link-clear" type="button">Take it off</button>
        </div>
      </div>
      <!-- The number does not enter the document; **the list goes in the same set**. -->
      <div data-fly="Footnote" id="put-note-fly">
        <div class="row">
          <input id="note-text" type="text" size="14" placeholder="the footnote's text">
          <button id="note-apply" type="button">Attach</button>
          <button id="note-clear" type="button">Take it off</button>
        </div>
        <button id="put-notes" type="button">Insert the footnote list</button>
      </div>
      <!-- One command with no settlement needs no set (Principle 1). -->
      <button id="put-toc" type="button">Insert the contents</button>

      <!-- **The text does not enter the document** — a press shows it from the text handed over
           ("Read the source in" first); it points by two names, not by line.
           Caution: **Do not move it into a submenu** — it would close while being read. -->
      <details class="sub"><summary>Tie to the source (refer to the source from the design document)</summary>
      <div class="items">
      <div class="row">
        <button id="source-open" type="button" title="Reads a source file in">Read the source in</button>
        <div id="source-pick" hidden title="which file to refer to"></div>
        <input id="source-name" type="text" size="12" placeholder="symbol (Inline.text)">
        <button id="source-link" type="button">Tie to the source</button>
        <!-- **A source window holds no text** (it cuts from the borrowed text each time). -->
        <button id="source-window" type="button" title="Inserts a source window showing that symbol's source">Insert a source window</button>
        <!-- **No symbol is wanted** (a draw is one file's settlement); it does not go stale. -->
        <button id="source-pulls" type="button" title="Inserts the diagram of what that file refers to">The draw diagram</button>
      </div>
      <!-- **Say a forgotten hand-over and a symbol that is gone apart** (the fixes differ). -->
      <div class="row">
        <button id="source-check" type="button" title="Confirms that every target is reached">Inspect the targets</button>
      </div>
      <div class="row"><span id="source-note"></span>
        <button id="source-shut" type="button" title="Closes the result shown">Fold</button>
      </div>
      <pre id="source-view" style="max-height:200px;overflow:auto;margin:0;font-size:12px" hidden></pre>
      </div>
      </details>
      <!-- It serves three sets, so it sits in none. -->
      <button id="drop-holder" type="button">Delete the selected table, slide or image</button>
    </div>
  </details>
