<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ksmd</title>
<link rel="stylesheet" href="page.css">
<link rel="stylesheet" href="table.css">
<link rel="stylesheet" href="tools.css">
<link rel="stylesheet" href="diagram.css">
<link rel="stylesheet" href="print.css">
</head>
<body>
<header class="top">
<nav class="menubar" aria-label="Menu bar">
  <span class="doc-name"></span>
  <span class="state" aria-live="polite"></span>
  <span class="read-only-mark">Read-only</span>
</nav>
<div class="quick" role="toolbar" aria-label="Quick access bar"></div>
<div class="formula-bar" role="group" aria-label="Formula bar">
  <span class="formula-address" title="The chosen cell or range"></span>
  <div class="formula-field"></div>
</div>
<div class="find" role="search" aria-label="Find and replace" hidden>
  <input class="find-text" type="search" placeholder="Find" aria-label="Find" spellcheck="false" autocomplete="off">
  <span class="find-count" aria-live="polite"></span>
  <button type="button" data-find="previous" title="Previous match (Shift+Enter)" aria-label="Previous match">&#x2191;</button>
  <button type="button" data-find="next" title="Next match (Enter)" aria-label="Next match">&#x2193;</button>
  <label><input class="find-case" type="checkbox"> Match case</label>
  <span class="replace-part" hidden>
    <input class="replace-text" type="text" placeholder="Replace with" aria-label="Replace with" spellcheck="false" autocomplete="off">
    <button type="button" data-find="replace" title="Replace this match (Enter in the box)">Replace</button>
    <button type="button" data-find="all" title="Replace every match, as one step of undo">Replace all</button>
  </span>
  <button type="button" data-find="close" title="Close (Esc)" aria-label="Close">&#x2715;</button>
</div>
<div id="notice" class="notice" role="alert" hidden>
  <p class="notice-text"></p>
  <div class="notice-choices"></div>
</div>
<div class="notice own-ask" role="region" aria-label="This document's own functions" hidden>
  <p class="own-ask-text"></p>
  <div class="notice-choices">
    <button type="button" class="own-allow">Allow</button>
    <button type="button" class="own-not-now">Not now</button>
  </div>
</div>
</header>
<dialog id="browse" class="browse" aria-labelledby="browse-title">
  <h2 id="browse-title" class="browse-title">Save as</h2>
  <nav class="browse-where" aria-label="Folder"></nav>
  <ul class="browse-list" aria-label="In this folder"></ul>
  <p class="browse-note" role="status" aria-live="polite"></p>
  <label class="browse-named">Name <input class="browse-name" type="text" spellcheck="false" autocomplete="off"></label>
  <div class="browse-choices">
    <button type="button" data-browse="ok">Save</button>
    <button type="button" data-browse="cancel">Cancel</button>
  </div>
</dialog>
<nav class="contents" aria-label="Contents" hidden>
  <div class="contents-head">Contents<button type="button" class="contents-close" title="Hide the contents (View, Contents)" aria-label="Hide the contents">&#x2715;</button></div>
  <ol class="contents-list"></ol>
</nav>
<div class="contents-edge" role="separator" aria-orientation="vertical" aria-label="Width of the contents" tabindex="0" title="Drag to change the width of the contents. Left and Right move it; a double-click gives the first width back" hidden></div>
<main id="doc" class="doc" contenteditable="true" spellcheck="true" role="textbox"
  aria-multiline="true" aria-label="Document"></main>
<footer class="status-bar" aria-label="Status bar">
  <span class="status-why" hidden></span>
  <span class="status-note" hidden></span>
  <span class="status-said" aria-live="polite"></span>
  <span class="status-own" hidden></span>
  <p id="status" class="status" role="status" aria-live="polite"></p>
  <span class="status-filter" hidden></span>
  <span class="status-page" hidden></span>
  <button type="button" class="figures" aria-haspopup="menu"></button>
  <span class="status-zoom" role="group" aria-label="Zoom of the document">
    <button type="button" class="zoom-out" title="Zoom out (Ctrl+Alt+-)" aria-label="Zoom out">&#x2212;</button>
    <button type="button" class="zoom-level" aria-haspopup="menu" title="Zoom of the document. The menus and the print keep their size">100%</button>
    <button type="button" class="zoom-in" title="Zoom in (Ctrl+Alt+=)" aria-label="Zoom in">+</button>
  </span>
</footer>
<script>const KSMD_WASM_BASE64 = "__KSMD_WASM_BASE64__";</script>
<script src="commands.js"></script>
<script src="handlers.js"></script>
<script src="view.js"></script>
<script src="table.js"></script>
<script src="sizes.js"></script>
<script src="outline.js"></script>
<script src="choices.js"></script>
<script src="rules.js"></script>
<script src="chart.js"></script>
<script src="drawings.js"></script>
<script src="diagram.js"></script>
<script src="images.js"></script>
<script src="settings.js"></script>
<script src="merge.js"></script>
<script src="notes.js"></script>
<script src="status.js"></script>
<script src="bar.js"></script>
<script src="figures.js"></script>
<script src="zoom.js"></script>
<script src="pages.js"></script>
<script src="touch.js"></script>
<script src="autosum.js"></script>
<script src="range.js"></script>
<script src="cut.js"></script>
<script src="paste.js"></script>
<script src="point.js"></script>
<script src="refs.js"></script>
<script src="suggest.js"></script>
<script src="catalog.js"></script>
<script src="filter.js"></script>
<script src="menu.js"></script>
<script src="quick.js"></script>
<script src="input.js"></script>
<script src="find.js"></script>
<script src="contents.js"></script>
<script src="local.js"></script>
<script src="keep.js"></script>
<script src="browse.js"></script>
<script src="file.js"></script>
<script src="functions.js"></script>
<script src="popup.js"></script>
<script src="core.js"></script>
<script>
  "use strict";
  // The page is one file (`ksmd/port/web/bundle.kspl`), so it opens from a file, and the local
  // server hands it out alone.
  const ksmdBytes = Uint8Array.from(atob(KSMD_WASM_BASE64), (c) => c.charCodeAt(0));
  ksmdStart(document.getElementById("doc"), document.querySelector(".menubar"),
    document.getElementById("status"), ksmdBytes).then((api) => {
    window.ksmd = api;
    document.documentElement.dataset.ready = "1";
  });
</script>
</body>
</html>
