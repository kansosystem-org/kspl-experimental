<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ksmd</title>
<link rel="stylesheet" href="page.css">
</head>
<body>
<header class="top">
<div class="files" role="toolbar" aria-label="File" hidden>
  <label for="path">Document</label>
  <input id="path" type="text" spellcheck="false" autocomplete="off" placeholder="notes.ksmd">
  <button type="button" data-file="open" title="Open the document at this path">Open</button>
  <button type="button" data-file="save" title="Save (Ctrl+S)">Save</button>
  <span class="state" aria-live="polite"></span>
</div>
<div class="bar" role="toolbar" aria-label="Editing commands">
  <button type="button" data-cmd="undo" title="Undo (Ctrl+Z)" disabled>Undo</button>
  <button type="button" data-cmd="redo" title="Redo (Ctrl+Y)" disabled>Redo</button>
  <select data-cmd="kind" aria-label="Kind of block">
    <option value="">Kind of block</option>
    <option value="p">Paragraph</option>
    <option value="h1">Heading 1</option>
    <option value="h2">Heading 2</option>
    <option value="h3">Heading 3</option>
    <option value="h4">Heading 4</option>
    <option value="h5">Heading 5</option>
    <option value="h6">Heading 6</option>
    <option value="c">Code</option>
  </select>
  <button type="button" data-cmd="bullets" title="Bulleted list">List</button>
  <button type="button" data-cmd="numbers" title="Numbered list">Numbered list</button>
  <button type="button" data-cmd="emphasis" title="Emphasis (Ctrl+I)"><em>Emphasis</em></button>
  <button type="button" data-cmd="strong" title="Strong emphasis (Ctrl+B)"><strong>Strong</strong></button>
  <button type="button" data-cmd="code" title="Inline code (Ctrl+E)"><code>Code</code></button>
  <button type="button" data-cmd="link" title="Link (Ctrl+K)">Link</button>
  <span class="gap-in-bar" aria-hidden="true"></span>
  <button type="button" data-cmd="table" title="Insert a table">Table</button>
  <button type="button" data-cmd="row-above">Row above</button>
  <button type="button" data-cmd="row-below">Row below</button>
  <button type="button" data-cmd="row-remove">Remove row</button>
  <button type="button" data-cmd="column-left">Column left</button>
  <button type="button" data-cmd="column-right">Column right</button>
  <button type="button" data-cmd="column-remove">Remove column</button>
  <button type="button" data-cmd="table-remove">Remove table</button>
</div>
<div id="notice" class="notice" role="alert" hidden>
  <p class="notice-text"></p>
  <div class="notice-choices"></div>
</div>
</header>
<main id="doc" class="doc" contenteditable="true" spellcheck="true" role="textbox"
  aria-multiline="true" aria-label="Document"></main>
<p id="status" class="status" role="status" aria-live="polite"></p>
<script>const KSMD_WASM_BASE64 = "__KSMD_WASM_BASE64__";</script>
<script src="view.js"></script>
<script src="table.js"></script>
<script src="input.js"></script>
<script src="local.js"></script>
<script src="keep.js"></script>
<script src="file.js"></script>
<script src="core.js"></script>
<script>
  "use strict";
  // The page is one file (`ksmd/port/web/bundle.kspl`), so it opens from a file, and the local
  // server hands it out alone.
  const ksmdBytes = Uint8Array.from(atob(KSMD_WASM_BASE64), (c) => c.charCodeAt(0));
  ksmdStart(document.getElementById("doc"), document.querySelector(".bar"),
    document.getElementById("status"), ksmdBytes).then((api) => {
    window.ksmd = api;
    document.documentElement.dataset.ready = "1";
  });
</script>
</body>
</html>
