<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ksmd</title>
<link rel="stylesheet" href="page.css">
<link rel="stylesheet" href="tools.css">
</head>
<body>
<header class="top">
<div class="files" role="toolbar" aria-label="File" hidden>
  <label for="path">Document</label>
  <input id="path" type="text" spellcheck="false" autocomplete="off" placeholder="notes.ksmd">
  <button type="button" data-file="open" title="Open the document at this path">Open</button>
  <button type="button" data-file="save" title="Save (Ctrl+S)">Save</button>
  <span class="state" aria-live="polite"></span>
</div>
<nav class="menubar" role="menubar" aria-label="Menu">
  <div class="top-menu">
    <button type="button" class="menu-name" aria-haspopup="menu" aria-expanded="false">Edit</button>
    <div class="menu" role="menu" aria-label="Edit" hidden>
      <button type="button" role="menuitem" data-cmd="undo" disabled>Undo<kbd>Ctrl+Z</kbd></button>
      <button type="button" role="menuitem" data-cmd="redo" disabled>Redo<kbd>Ctrl+Y</kbd></button>
      <hr>
      <button type="button" role="menuitem" data-cmd="find">Find&hellip;<kbd>Ctrl+F</kbd></button>
      <button type="button" role="menuitem" data-cmd="replace">Replace&hellip;<kbd>Ctrl+H</kbd></button>
    </div>
  </div>
  <div class="top-menu">
    <button type="button" class="menu-name" aria-haspopup="menu" aria-expanded="false">View</button>
    <div class="menu" role="menu" aria-label="View" hidden>
      <button type="button" role="menuitemcheckbox" aria-checked="false" data-cmd="contents">Contents</button>
    </div>
  </div>
  <div class="top-menu">
    <button type="button" class="menu-name" aria-haspopup="menu" aria-expanded="false">Format</button>
    <div class="menu" role="menu" aria-label="Format" hidden>
      <div class="sub">
        <button type="button" role="menuitem" class="sub-name" aria-haspopup="menu" aria-expanded="false">Kind of block</button>
        <div class="menu flyout" role="menu" aria-label="Kind of block" hidden>
          <button type="button" role="menuitem" data-cmd="p">Paragraph<kbd>Ctrl+Alt+0</kbd></button>
          <button type="button" role="menuitem" data-cmd="h1">Heading 1<kbd>Ctrl+Alt+1</kbd></button>
          <button type="button" role="menuitem" data-cmd="h2">Heading 2<kbd>Ctrl+Alt+2</kbd></button>
          <button type="button" role="menuitem" data-cmd="h3">Heading 3<kbd>Ctrl+Alt+3</kbd></button>
          <button type="button" role="menuitem" data-cmd="h4">Heading 4<kbd>Ctrl+Alt+4</kbd></button>
          <button type="button" role="menuitem" data-cmd="h5">Heading 5<kbd>Ctrl+Alt+5</kbd></button>
          <button type="button" role="menuitem" data-cmd="h6">Heading 6<kbd>Ctrl+Alt+6</kbd></button>
          <button type="button" role="menuitem" data-cmd="c">Code</button>
        </div>
      </div>
      <div class="sub">
        <button type="button" role="menuitem" class="sub-name" aria-haspopup="menu" aria-expanded="false">List</button>
        <div class="menu flyout" role="menu" aria-label="List" hidden>
          <button type="button" role="menuitem" data-cmd="bullets">Bulleted list</button>
          <button type="button" role="menuitem" data-cmd="numbers">Numbered list</button>
          <button type="button" role="menuitem" data-cmd="indent">Indent item<kbd>Tab</kbd></button>
          <button type="button" role="menuitem" data-cmd="outdent">Outdent item<kbd>Shift+Tab</kbd></button>
        </div>
      </div>
      <div class="sub">
        <button type="button" role="menuitem" class="sub-name" aria-haspopup="menu" aria-expanded="false">Align</button>
        <div class="menu flyout" role="menu" aria-label="Align" hidden>
          <button type="button" role="menuitem" data-cmd="align-left">Left</button>
          <button type="button" role="menuitem" data-cmd="align-center">Centre</button>
          <button type="button" role="menuitem" data-cmd="align-right">Right</button>
          <button type="button" role="menuitem" data-cmd="align-none">Default</button>
        </div>
      </div>
      <hr>
      <button type="button" role="menuitem" data-cmd="emphasis"><em>Emphasis</em><kbd>Ctrl+I</kbd></button>
      <button type="button" role="menuitem" data-cmd="strong"><strong>Strong</strong><kbd>Ctrl+B</kbd></button>
      <button type="button" role="menuitem" data-cmd="code"><code>Inline code</code><kbd>Ctrl+E</kbd></button>
      <button type="button" role="menuitem" data-cmd="link">Link&hellip;<kbd>Ctrl+K</kbd></button>
      <hr>
      <button type="button" role="menuitem" data-cmd="look-clear">Clear formatting</button>
    </div>
  </div>
  <div class="top-menu">
    <button type="button" class="menu-name" aria-haspopup="menu" aria-expanded="false">Insert</button>
    <div class="menu" role="menu" aria-label="Insert" hidden>
      <button type="button" role="menuitem" data-cmd="table">Table</button>
      <hr>
      <button type="button" role="menuitem" data-cmd="date">Today's date<kbd>Ctrl+;</kbd></button>
      <button type="button" role="menuitem" data-cmd="time">Time now<kbd>Ctrl+:</kbd></button>
    </div>
  </div>
  <div class="top-menu">
    <button type="button" class="menu-name" aria-haspopup="menu" aria-expanded="false">Table</button>
    <div class="menu" role="menu" aria-label="Table" hidden data-table-menu>
    </div>
  </div>
</nav>
<div class="ribbon" role="toolbar" aria-label="Tools">
  <div class="group" role="group" aria-label="Edit">
    <button type="button" data-cmd="undo" title="Undo (Ctrl+Z)" disabled><span class="icon">&#x21B6;</span>Undo</button>
    <button type="button" data-cmd="redo" title="Redo (Ctrl+Y)" disabled><span class="icon">&#x21B7;</span>Redo</button>
    <button type="button" data-cmd="find" title="Find (Ctrl+F); replace with Ctrl+H"><span class="icon">&#x1F50D;</span>Find</button>
  </div>
  <div class="group" role="group" aria-label="Font">
    <select data-ribbon="kind" aria-label="Kind of block" title="Kind of block">
      <option value="">Kind of block</option>
      <option value="p">Paragraph</option>
      <option value="h1">Heading 1</option>
      <option value="h2">Heading 2</option>
      <option value="h3">Heading 3</option>
      <option value="h4">Heading 4</option>
      <option value="h5">Heading 5</option>
      <option value="h6">Heading 6</option>
      <option value="c">Code</option>
    </select>
    <select data-ribbon="size" aria-label="Font size" title="Font size">
      <option value="">Size</option>
      <option value="-">Default</option>
    </select>
    <button type="button" data-cmd="strong" title="Strong (Ctrl+B)"><strong>B</strong></button>
    <button type="button" data-cmd="emphasis" title="Emphasis (Ctrl+I)"><em>I</em></button>
    <button type="button" data-cmd="code" title="Inline code (Ctrl+E)"><code>&lt;/&gt;</code></button>
    <span class="split" data-colour="color">
      <button type="button" class="apply" title="Font colour"><span class="icon">A</span><span class="swatch"></span></button>
      <button type="button" class="more" aria-haspopup="true" title="Choose the font colour">&#x25BE;</button>
    </span>
    <span class="split" data-colour="fill">
      <button type="button" class="apply" title="Fill colour"><span class="icon">&#x25A7;</span><span class="swatch"></span></button>
      <button type="button" class="more" aria-haspopup="true" title="Choose the fill colour">&#x25BE;</button>
    </span>
    <button type="button" data-cmd="look-clear" title="Clear colours, size and alignment"><span class="icon">&#x2300;</span>Clear</button>
  </div>
  <div class="group" role="group" aria-label="Paragraph">
    <button type="button" data-cmd="align-left" title="Align left"><span class="icon">&#x2261;</span>Left</button>
    <button type="button" data-cmd="align-center" title="Centre"><span class="icon">&#x2263;</span>Centre</button>
    <button type="button" data-cmd="align-right" title="Align right"><span class="icon">&#x2262;</span>Right</button>
    <button type="button" data-cmd="bullets" title="Bulleted list"><span class="icon">&#x2022;</span>List</button>
    <button type="button" data-cmd="numbers" title="Numbered list"><span class="icon">1.</span>Numbered</button>
    <button type="button" data-cmd="link" title="Link (Ctrl+K)"><span class="icon">&#x1F517;</span>Link</button>
  </div>
  <div class="group" role="group" aria-label="Insert">
    <button type="button" data-cmd="table" title="Insert a table"><span class="icon">&#x25A6;</span>Table</button>
    <button type="button" data-cmd="date" title="Today's date (Ctrl+;)"><span class="icon">&#x1F4C5;</span>Date</button>
    <button type="button" data-cmd="time" title="Time now (Ctrl+:)"><span class="icon">&#x23F2;</span>Time</button>
  </div>
  <div class="group table-group" role="group" aria-label="Table" hidden>
    <button type="button" data-cmd="row-above" title="Insert row above">Row above</button>
    <button type="button" data-cmd="row-below" title="Insert row below">Row below</button>
    <button type="button" data-cmd="row-remove" title="Remove row">Remove row</button>
    <button type="button" data-cmd="column-left" title="Insert column left">Column left</button>
    <button type="button" data-cmd="column-right" title="Insert column right">Column right</button>
    <button type="button" data-cmd="column-remove" title="Remove column">Remove column</button>
    <button type="button" data-cmd="sort-up" title="Sort ascending">Sort &#x2191;</button>
    <button type="button" data-cmd="sort-down" title="Sort descending">Sort &#x2193;</button>
    <button type="button" data-cmd="filter-column" title="Filter this column">Filter</button>
  </div>
</div>
<div class="find" role="search" aria-label="Find and replace" hidden>
  <input class="find-text" type="search" placeholder="Find" aria-label="Find" spellcheck="false" autocomplete="off">
  <span class="find-count" aria-live="polite"></span>
  <button type="button" data-find="previous" title="Previous match (Shift+Enter)" aria-label="Previous match">&#x2191;</button>
  <button type="button" data-find="next" title="Next match (Enter)" aria-label="Next match">&#x2193;</button>
  <label><input class="find-case" type="checkbox"> Match case</label>
  <span class="replace-part" hidden>
    <input class="replace-text" type="text" placeholder="Replace with" aria-label="Replace with" spellcheck="false" autocomplete="off">
    <button type="button" data-find="replace" title="Replace this match (Enter in the box)">Replace</button>
    <button type="button" data-find="all" title="Replace every match, as one step of undo">Replace all</button>
  </span>
  <button type="button" data-find="close" title="Close (Esc)" aria-label="Close">&#x2715;</button>
</div>
<div id="notice" class="notice" role="alert" hidden>
  <p class="notice-text"></p>
  <div class="notice-choices"></div>
</div>
</header>
<nav class="contents" aria-label="Contents" hidden>
  <div class="contents-head">Contents<button type="button" class="contents-close" title="Hide the contents (View, Contents)" aria-label="Hide the contents">&#x2715;</button></div>
  <ol class="contents-list"></ol>
</nav>
<main id="doc" class="doc" contenteditable="true" spellcheck="true" role="textbox"
  aria-multiline="true" aria-label="Document"></main>
<p id="status" class="status" role="status" aria-live="polite"></p>
<script>const KSMD_WASM_BASE64 = "__KSMD_WASM_BASE64__";</script>
<script src="view.js"></script>
<script src="table.js"></script>
<script src="range.js"></script>
<script src="filter.js"></script>
<script src="menu.js"></script>
<script src="ribbon.js"></script>
<script src="input.js"></script>
<script src="find.js"></script>
<script src="contents.js"></script>
<script src="local.js"></script>
<script src="keep.js"></script>
<script src="file.js"></script>
<script src="core.js"></script>
<script>
  "use strict";
  // The page is one file (`ksmd/port/web/bundle.kspl`), so it opens from a file, and the local
  // server hands it out alone.
  const ksmdBytes = Uint8Array.from(atob(KSMD_WASM_BASE64), (c) => c.charCodeAt(0));
  ksmdStart(document.getElementById("doc"), document.querySelector(".menubar"),
    document.getElementById("status"), ksmdBytes).then((api) => {
    window.ksmd = api;
    document.documentElement.dataset.ready = "1";
  });
</script>
</body>
</html>
