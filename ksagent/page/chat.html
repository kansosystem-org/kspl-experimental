<!doctype html>
<!--
  ksagent's chat page, served by a local server (`kssrv --local --page=<the built file>`). The
  build puts its look (`chat.css`), the Markdown reader (`markdown.js`) and kssrv's client inside
  it (`kssrv/page/bundle.kspl`), so it is served as one file.
  It asks by appending to <name>.ask.jsonl, and shows <name>.chat.jsonl and <name>.live.json,
  which only ksagent writes. The reasons are "The chat page" in ksagent/docs/DESIGN-agent.md.
  Caution: **Never hand the model's text to innerHTML.** The Markdown reader builds a tree of
  allowed elements, and text goes into the page only as text nodes.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self'; img-src 'none'; base-uri 'none'; form-action 'none'">
<title>ksagent</title>
<link rel="stylesheet" href="chat.css">
</head>
<body>
<nav id="side" aria-label="Conversations">
  <button id="new" type="button">New conversation</button>
  <ul id="chats"></ul>
</nav>
<main>
  <div id="log" role="log" aria-live="polite"><button id="latest" type="button">Latest</button></div>
  <div id="notice" role="alert"></div>
  <form id="ask">
    <!-- **The box is named apart from its placeholder**: the placeholder goes once text is typed,
      and not every screen reader reads it as a name. -->
    <textarea id="text" rows="1" aria-label="Ask about the files in this folder"
      placeholder="Ask about the files in this folder" disabled></textarea>
    <button id="send" class="main" type="submit" disabled>Ask</button>
  </form>
</main>
<script src="markdown.js"></script>
<script src="client.js"></script>
<script>
"use strict";
// The page: the three files of a conversation, and what each turn shows. kssrv's client (the
// script above) speaks the local server's protocol ("docs/SPEC-local-server.md" in the
// repository). **The page writes only the ask file**, and every write names the bytes it read, so
// a write from another tab is never lost.
(() => {
  const LOOK_MS = 1000;
  const HINT_MS = 15000;
  const NAME = /^[\p{L}\p{N}._-]+$/u;
  const $ = (id) => document.getElementById(id);
  const ja = (navigator.language || "").startsWith("ja");
  // **An Excel source is placed by the sheet and rows Excel shows**, which ksagent records with
  // it; a line of the view is no row a person can find. Any other source, by its lines.
  const placeWords = (s) => {
    const span = (a, b) => (String(a) === String(b) ? String(a) : `${a}–${b}`);
    if (typeof s.sheet !== "string" || s.sheet === "") {
      return ja ? `${s.from_line}–${s.to_line}${W.lines}` : `${W.lines} ${s.from_line}–${s.to_line}`;
    }
    const sheet = String(s.sheet), last = String(s.to_sheet);
    if (ja) {
      return sheet === last ? `シート「${sheet}」${span(s.from_row, s.to_row)}行目` :
        `シート「${sheet}」${s.from_row}行目〜シート「${last}」${s.to_row}行目`;
    }
    if (sheet !== last) return `sheet ${sheet}, row ${s.from_row} to sheet ${last}, row ${s.to_row}`;
    return String(s.from_row) === String(s.to_row) ? `sheet ${sheet}, row ${s.from_row}` :
      `sheet ${sheet}, rows ${s.from_row}–${s.to_row}`;
  };
  const W = ja ? {
    checked: "出典を確認しました", unverified: "未確認", not_found: "見つかりません",
    stopped: "止まりました", failed: "回答できませんでした", writing: "書いています (出典は未確認)",
    pending: "ksagent を待っています", stopping: "止めています", sources: "出典", lines: "行目",
    partial: "下の文は途中までで、出典は確認していません。", hint: "このフォルダーで ksagent watch が動いているか確かめてください。",
    stop: "止める", again: "もう一度聞く", removed: "取り除いた出典", waiting: "モデルの返事を待っています",
    thinking: "モデルが考えています", reading: "モデルがファイルを読んでいます: ",
    writingPhase: "モデルが書いています", untaken: "ksagent が受け取る前に止めました。",
    gaveUp: "ksagent は回答を記録できませんでした: ", unshown: "このやり取りは表示できません: ",
    quiet: "ksagent が 15 秒以上なにも書いていません。このフォルダーで ksagent watch が動いているか確かめてください。",
  } : {
    checked: "Sources checked", unverified: "Unverified", not_found: "Not found",
    stopped: "Stopped", failed: "No answer", writing: "Being written: sources not checked yet",
    pending: "Waiting for ksagent", stopping: "Stopping", sources: "Sources", lines: "lines",
    partial: "The text below is not whole, and its sources were not checked.",
    hint: "Check that ksagent watch runs on this folder.", stop: "Stop", again: "Ask again",
    removed: "Sources removed", waiting: "Waiting for the model", thinking: "The model is thinking",
    reading: "The model is reading: ", writingPhase: "The model is writing",
    untaken: "Stopped before ksagent took it.", gaveUp: "ksagent could not record an answer: ",
    unshown: "This turn cannot be shown: ",
    quiet: "ksagent has written nothing for over 15 seconds. Check that ksagent watch runs on this folder.",
  };
  if (ja) {
    document.documentElement.lang = "ja";
    $("new").textContent = "新しい会話";
    $("send").textContent = "聞く";
    $("text").placeholder = "このフォルダーのファイルについて聞く";
    $("text").setAttribute("aria-label", $("text").placeholder);
  }

  // **A slow model does not make a request slow**: ksagent writes the answer into files, and the
  // page reads them each second (LOOK_MS). So a request waits only for the local server, and the
  // client's limit (WAIT_MS) holds.
  const local = kssrvLocal("ksagent");
  const { send, digest, WAIT_MS } = local;
  // What a request that failed means, in words a person can act on.
  const failed = (e) => (e && e.name === "TimeoutError" ?
    `The local server did not answer within ${WAIT_MS / 1000} seconds. The page asks again each ` +
      "second." : `${e.message}. Start the page again with the command that opened it.`);
  // What a question whose save went unanswered means. **The save may still have reached the file**,
  // so the page cannot say "not saved", and it does not resend by itself.
  const UNSURE = `The local server did not answer within ${WAIT_MS / 1000} seconds, so the question ` +
    "may not be saved. It is back in the text box: ask again, and it is saved only once.";
  // The same for a stop. **The page does not send it again**, so the notice says what the person
  // can do; a second stop for the same answer does no harm.
  const STOP_UNSURE = `The local server did not answer within ${WAIT_MS / 1000} seconds, so the ` +
    "stop may not be saved. The page does not send it again: if the answer goes on, press Stop again.";
  const fileUrl = (p) => local.ask("file", p);
  async function read(path) {
    const got = await local.read(path);
    if (got.status === 404) return { bytes: null };
    if (got.status !== 200) throw new Error(`the local server refused ${path} (${got.status})`);
    return { bytes: got.bytes };
  }
  async function stat(path) {
    const got = await local.stat(path);
    if (got.status === 404) return "none";
    if (got.status !== 200) throw new Error(`the local server refused ${path} (${got.status})`);
    return `${got.size}/${got.at}`;
  }

  // One JSON record a line; a line that cannot be read is named, never skipped without a word.
  // `lacks` says why a record has no usable type or id; an ask file's rules take any, as "".
  const noTypeOrId = (r) => (r && typeof r.id === "string" && typeof r.type === "string" ? "" :
    "it has no type or id");
  function records(bytes, file, lacks = noTypeOrId) {
    const out = [];
    const broken = [];
    new TextDecoder().decode(bytes || new Uint8Array()).split("\n").forEach((line, k) => {
      if (line.trim() === "") return;
      let r;
      try {
        r = JSON.parse(line);
      } catch (_) {
        broken.push(`${file}, line ${k + 1}: it is not one JSON value`);
        return;
      }
      const why = lacks(r);
      if (why) broken.push(`${file}, line ${k + 1}: ${why}`);
      else {
        const o = r !== null && typeof r === "object" && !Array.isArray(r) ? r : {};
        out.push({ ...o, id: typeof o.id === "string" ? o.id : "",
          type: typeof o.type === "string" ? o.type : "", line: k + 1 });
      }
    });
    return { out, broken };
  }

  // An ask file's records, read with ksagent's rules (`read_asks` in ksagent/chat.kspl), so a
  // question ksagent passes over is named here too, never shown as waiting. The reasons are its
  // words; the browser check compares them with what ksagent prints.
  const ID = /^[A-Za-z0-9_-]{1,64}$/;
  function asks(bytes, file) {
    const { out, broken } = records(bytes, file, () => "");
    const taken = [];
    const asked = new Set();
    for (const r of out) {
      const why = !ID.test(r.id) ? (r.id.length === 0 || r.id.length > 64 ?
        "the id must hold 1 to 64 characters" :
        "the id holds a character other than ASCII letters, digits, - and _") :
        r.type === "question" ? ((typeof r.text === "string" ? r.text : "").trim() === "" ?
          "the question has no text" :
          asked.has(r.id) ? "an earlier line has a question with the same id" : "") :
          r.type === "stop" ? (asked.has(r.id) ? "" : "no earlier line has a question with this id") :
            "its type is neither question nor stop";
      if (why) broken.push(`${file}, line ${r.line}: ${why}`);
      else {
        if (r.type === "question") asked.add(r.id);
        taken.push(r);
      }
    }
    return { out: taken, broken };
  }

  // `liveStamp` is the live file's size and second last seen, and `liveSeen` when it last changed,
  // by this page's clock.
  const S = { name: "", ask: null, chat: null, live: null, refused: "", stamps: {},
    askedAt: new Map(), shown: new Map(), problem: "", late: "", unsure: null, stopUnsure: null,
    ready: false, liveStamp: null, liveSeen: 0 };
  const path = (kind) => `${S.name}.${kind}`;

  // Reads one of the conversation's files again where it changed. Caution: **Drop what comes
  // back after the person opened another conversation.** Kept, the old conversation's turns
  // showed in the new one.
  async function refresh(kind, file) {
    const name = S.name;
    const at = path(file);
    const now = await stat(at);
    if (S.name !== name || S.stamps[kind] === now) return false;
    const got = now === "none" ? { bytes: null } : await read(at);
    if (S.name !== name) return false;
    S.stamps[kind] = now;
    S[kind] = (kind === "ask" ? asks : records)(got.bytes, at);
    return true;
  }

  // The turns to show: those the chat file records, then the questions it does not hold yet.
  function turns() {
    const list = [];
    const byId = new Map();
    const add = (id, text) => {
      if (!byId.has(id)) { byId.set(id, { id, text, answer: null, stop: false }); list.push(byId.get(id)); }
      return byId.get(id);
    };
    for (const r of (S.chat ? S.chat.out : [])) {
      if (r.type === "question") add(r.id, String(r.text || ""));
      else if (r.type === "answer" && byId.has(r.id)) byId.get(r.id).answer = r;
    }
    for (const r of (S.ask ? S.ask.out : [])) {
      if (r.type === "question") add(r.id, String(r.text || ""));
      else if (r.type === "stop" && byId.has(r.id)) byId.get(r.id).stop = true;
    }
    return list;
  }
  const isOpen = (t) => t.answer === null;

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }
  function markdown(text) {
    return ksagentMarkdown.render(ksagentMarkdown.parse(text), el("div", "md"));
  }
  function button(label, run) {
    const b = el("button", "", label);
    b.type = "button";
    b.addEventListener("click", run);
    return b;
  }

  // What one turn shows: its text part, the button it offers (`act`), and the state a check reads
  // (`data-state`). **Only an answer record whose state is `checked` shows as checked**; the
  // growing text and a stopped answer's partial text stand apart, marked as not checked.
  function view(t) {
    const live = S.live && S.live.id === t.id ? S.live : null;
    const a = t.answer;
    let state;
    if (a) state = ["checked", "unverified", "not_found", "stopped", "failed"].includes(a.state) ?
      a.state : "failed";
    else if (live && live.phase === "stopped") state = "stopped";
    else if (t.stop) state = live && live.phase !== "done" ? "stopping" : "untaken";
    else state = live && live.phase !== "done" ? "writing" : "pending";
    const box = el("div", "part");
    let act = "";
    box.appendChild(el("div", "badge", W[state] || W.stopped));
    if (a) {
      if (a.state === "checked" || a.state === "unverified" || a.state === "not_found") {
        box.appendChild(markdown(a.text || ""));
      }
      if (typeof a.partial === "string" && a.partial !== "") {
        box.appendChild(el("p", "phase", W.partial));
        box.appendChild(markdown(a.partial)).classList.add("unchecked");
      }
      const srcs = Array.isArray(a.sources) ? a.sources : [];
      if (srcs.length > 0 && a.state === "checked") {
        box.appendChild(el("div", "phase", W.sources));
        const ol = box.appendChild(el("ol", "sources"));
        for (const s of srcs) {
          const li = ol.appendChild(el("li"));
          li.appendChild(el("code", "", String(s.path)));
          li.appendChild(document.createTextNode(" " + placeWords(s)));
          li.appendChild(el("blockquote", "", String(s.quote)));
        }
      }
      const notes = Array.isArray(a.notes) ? a.notes : [];
      if (notes.length > 0) {
        const ul = box.appendChild(el("ul", "notes"));
        for (const n of notes) ul.appendChild(el("li", "", String(n)));
      }
      if (Array.isArray(a.removed) && a.removed.length > 0) {
        const d = box.appendChild(el("details", "notes"));
        d.appendChild(el("summary", "", W.removed));
        for (const r of a.removed) d.appendChild(el("div", "", String(r)));
      }
      if (a.state === "stopped" || a.state === "failed") act = "again";
    } else if (state === "writing" || state === "stopping") {
      const phase = { waiting: W.waiting, thinking: W.thinking, writing: W.writingPhase,
        reading: W.reading + String(live.tools || "") }[live.phase] || W.waiting;
      box.appendChild(el("div", "phase", phase));
      if (quiet(t)) box.appendChild(el("div", "phase", W.quiet));
      if (live.text) box.appendChild(markdown(live.text)).classList.add("unchecked");
    } else if (state === "stopped") {
      // ksagent gave up on recording the answer: the live file says why, beside the text shown.
      box.appendChild(el("ul", "notes")).appendChild(el("li", "", W.gaveUp + String(live.why || "")));
      if (live.text) {
        box.appendChild(el("p", "phase", W.partial));
        box.appendChild(markdown(live.text)).classList.add("unchecked");
      }
      act = "again";
    } else if (state === "untaken") {
      box.appendChild(el("div", "phase", W.untaken));
      act = "again";
    } else if (hinted(t)) {
      box.appendChild(el("div", "phase", W.hint));
    }
    if (state === "writing" || state === "pending") act = "stop";
    return { box, act, state };
  }

  const hinted = (t) => !S.refused && Date.now() - (S.askedAt.get(t.id) || Date.now()) > HINT_MS;
  // **A live file that stops changing names a ksagent that no longer runs**: while it works,
  // ksagent writes the file again every 5 seconds. Stopped by Ctrl+C, it leaves the file as it last
  // was, and the turn would say "The model is writing" for good.
  const quiet = (t) => S.live !== null && S.live.id === t.id && Date.now() - S.liveSeen > HINT_MS;

  // A turn that cannot be shown says so, with its text as plain text, and the rest goes on.
  function unshown(t, e) {
    const box = el("div", "part");
    box.appendChild(el("div", "phase", W.unshown + String(e && e.message)));
    box.appendChild(el("pre", "unchecked", String((t.answer && t.answer.text) || "")));
    return { box, act: "", state: "failed" };
  }

  // A turn's frame: its question, then its answer box, which holds the text part and the
  // actions. **Only the text part is built again**; the frame and the button stay.
  function frame(t) {
    const turn = el("section", "turn");
    turn.dataset.id = t.id;
    turn.appendChild(el("div", "q")).appendChild(el("div", "bubble", t.text));
    const a = turn.appendChild(el("div", "a"));
    a.appendChild(el("div", "part"));
    a.appendChild(el("div", "actions")).dataset.act = "";
    return turn;
  }
  // Puts the turn's button in place. Caution: **Keep the button that stands there when it is the
  // same one.** Built again each second, a Stop pressed while the answer grew lost its click
  // where the press and the release met two buttons, and the keyboard's focus went with it.
  function offer(actions, act, t) {
    if (actions.dataset.act === act) return;
    actions.dataset.act = act;
    actions.replaceChildren(...(act === "stop" ? [button(W.stop, () => stop(t.id))] :
      act === "again" ? [button(W.again, () => ask(t.text))] : []));
  }

  // Draws only the turns whose records changed: **a turn is read and drawn again only when what
  // it shows from changed**, so a growing answer leaves the rest of the page still and unread.
  // **A screen reader hears an answer once it is whole**: the log reads out what is added to it,
  // so the box of an answer still open is marked busy, and its growing text is not read out
  // again each second.
  function draw() {
    const log = $("log");
    const bottom = log.scrollHeight - log.scrollTop - log.clientHeight < 60;
    const all = turns();
    for (const t of all) {
      if (!S.askedAt.has(t.id)) S.askedAt.set(t.id, Date.now());
      const live = S.live && S.live.id === t.id ? S.live : null;
      const from = [t.text, t.answer, t.stop, live, !t.answer && hinted(t),
        !t.answer && quiet(t)];
      const had = S.shown.get(t.id);
      if (had && from.every((x, k) => x === had.from[k])) continue;
      let shown;
      try {
        shown = view(t);
      } catch (e) {
        shown = unshown(t, e);
      }
      const { box, act, state } = shown;
      const turn = had ? had.node : log.insertBefore(frame(t), $("latest"));
      const a = turn.children[1];
      a.className = `a ${state === "stopping" || state === "untaken" ? "stopped" : state}`;
      a.setAttribute("aria-busy", String(["writing", "stopping", "pending"].includes(state)));
      a.children[0].replaceWith(box);
      offer(a.children[1], act, t);
      turn.dataset.state = state;
      S.shown.set(t.id, { from, node: turn });
    }
    // A turn whose question no file holds any more goes, as when a person edits the ask file.
    const listed = new Set(all.map((t) => t.id));
    for (const [id, had] of S.shown) {
      if (!listed.has(id)) { had.node.remove(); S.shown.delete(id); }
    }
    const broken = [...(S.ask ? S.ask.broken : []), ...(S.chat ? S.chat.broken : [])];
    // **Each line once**: a look and a save that fail for one cause say the same words.
    $("notice").textContent = [...new Set([S.late, S.problem, S.refused, ...broken].filter((x) => x))]
      .join("\n");
    if (bottom) log.scrollTop = log.scrollHeight;
    $("latest").style.display = bottom ? "none" : "block";
  }

  // Appends one record to the ask file. The write names the digest of the bytes read, or
  // `missing`; a 409 means another tab wrote meanwhile, so it reads again and appends again.
  // A question whose id the file holds already is not written again: a save that went unanswered
  // may have reached the file.
  async function append(record) {
    for (let tries = 0; tries < 5; tries++) {
      const got = await read(path("ask.jsonl"));
      const had = got.bytes ? new TextDecoder().decode(got.bytes) : "";
      if (record.type === "question" && holds(had, record.id)) return "";
      const sep = had === "" || had.endsWith("\n") ? "" : "\n";
      const body = new TextEncoder().encode(`${had}${sep}${JSON.stringify(record)}\n`);
      const put = await send(fileUrl(path("ask.jsonl")), { method: "PUT", body,
        headers: { "X-Kanso-If-Content": got.bytes ? await digest(got.bytes) : "missing" } });
      if (put.ok) return "";
      if (put.status !== 409) return `The local server did not save the question (${put.status}).`;
    }
    return "The ask file kept changing while it was saved. Try again.";
  }
  function holds(had, id) {
    return had.split("\n").some((line) => {
      try {
        const r = JSON.parse(line);
        return r !== null && r.type === "question" && r.id === id;
      } catch (_) { return false; }
    });
  }
  // Caution: **A question not known to be saved goes back into the text box, and keeps its id.**
  // The box was emptied when it was sent. Asked again, the same id lets append write it once,
  // even where the first save reached the file late.
  async function ask(text) {
    const id = S.unsure && S.unsure.text === text ? S.unsure.id : crypto.randomUUID();
    S.askedAt.set(id, Date.now());
    S.problem = await append({ type: "question", id, text }).catch((e) =>
      e && e.name === "TimeoutError" ? UNSURE : failed(e));
    S.unsure = S.problem === "" ? null : { id, text };
    S.stopUnsure = null;
    if (S.unsure && $("text").value.trim() === "") $("text").value = text;
    // **Draw the notice here**: look draws only when a file changed, and a lost save changed none.
    draw();
    await look();
  }
  async function stop(id) {
    S.problem = await append({ type: "stop", id }).catch((e) =>
      e && e.name === "TimeoutError" ? STOP_UNSURE : failed(e));
    S.stopUnsure = S.problem === STOP_UNSURE ? id : null;
    draw();
    await look();
  }

  async function look() {
    const name = S.name;
    try {
      const a = await refresh("ask", "ask.jsonl");
      const c = await refresh("chat", "chat.jsonl");
      if (S.name !== name) return;
      let l = false;
      if (turns().some(isOpen)) {
        // The size and the second it changed tell a file written again, even with the same bytes.
        const stamp = await stat(path("live.json"));
        const got = await read(path("live.json"));
        if (S.name !== name) return;
        if (stamp !== S.liveStamp) { S.liveStamp = stamp; S.liveSeen = Date.now(); }
        let live = null;
        try {
          live = got.bytes ? JSON.parse(new TextDecoder().decode(got.bytes)) : null;
        } catch (_) { /* ksagent replaces the file whole, so this is a file of another writer */ }
        if (!live || typeof live.id !== "string") live = null;
        // ksagent answers none of this conversation's questions, and says why (an empty id).
        const refused = live && live.id === "" && live.phase === "refused" ? String(live.why || "") : "";
        if (refused !== S.refused) { S.refused = refused; l = true; }
        if (refused) live = null;
        if (JSON.stringify(live) !== JSON.stringify(S.live)) { S.live = live; l = true; }
      }
      // **A look's own failure is said only until the next look gets through**: the server may
      // answer again, and a stale notice would then mislead.
      const late = S.late !== "";
      S.late = "";
      // A question whose save went unanswered and now stands in the file was saved after all.
      if (S.unsure && (S.ask ? S.ask.out : []).some((r) => r.type === "question" && r.id === S.unsure.id)) {
        if ($("text").value.trim() === S.unsure.text) $("text").value = "";
        S.unsure = null;
        S.problem = "";
        draw();
      }
      // Likewise a stop whose save went unanswered.
      if (S.stopUnsure && (S.ask ? S.ask.out : []).some((r) => r.type === "stop" && r.id === S.stopUnsure)) {
        S.stopUnsure = null;
        S.problem = "";
        draw();
      }
      if (a || c || l || late || turns().some(isOpen)) draw();
    } catch (e) {
      if (S.name !== name) return;
      S.late = failed(e);
      draw();
    }
  }

  async function listChats() {
    const got = await send("/api/list?path=");
    const said = got.ok ? await got.json() : { files: [] };
    const names = new Set();
    for (const f of said.files) {
      const m = /^(.*)\.(ask|chat)\.jsonl$/.exec(f);
      if (m && NAME.test(m[1])) names.add(m[1]);
    }
    return [...names].sort();
  }
  function newName() {
    const d = new Date();
    const two = (n) => String(n).padStart(2, "0");
    return `chat-${d.getFullYear()}${two(d.getMonth() + 1)}${two(d.getDate())}-` +
      `${two(d.getHours())}${two(d.getMinutes())}${two(d.getSeconds())}`;
  }
  async function open(name) {
    S.name = name;
    S.ask = S.chat = S.live = S.liveStamp = null;
    S.refused = "";
    S.stamps = {};
    S.shown.clear();
    for (const t of [...document.querySelectorAll(".turn")]) t.remove();
    history.replaceState(null, "", `${location.pathname}?chat=${encodeURIComponent(name)}`);
    document.title = `${name} - ksagent`;
    // **A list that cannot be read still opens the conversation**, and the notice says why.
    const names = await listChats().catch((e) => {
      S.late = failed(e);
      draw();
      return [];
    });
    if (!names.includes(name)) names.push(name);
    const ul = $("chats");
    ul.textContent = "";
    for (const n of names.reverse()) {
      const a = ul.appendChild(el("li")).appendChild(el("a", "", n));
      a.href = `?chat=${encodeURIComponent(n)}`;
      if (n === name) a.setAttribute("aria-current", "page");
      a.addEventListener("click", (e) => { e.preventDefault(); open(n); });
    }
    await look();
  }

  async function start() {
    let said = null;
    try {
      const got = await send("/api/status");
      said = got.ok ? await got.json() : null;
    } catch (_) { /* no local server: said stays null */ }
    if (!said || said.local !== true || said.conditional_writes !== true) {
      S.problem = "This page cannot reach its files. Open the URL the command printed, " +
        "token included.";
      draw();
      return;
    }
    local.hold();
    const asked = new URLSearchParams(location.search).get("chat");
    const names = await listChats();
    await open(asked && NAME.test(asked) ? asked : names[names.length - 1] || newName());
    $("text").disabled = false;
    $("send").disabled = false;
    $("text").focus();
    document.documentElement.dataset.chat = "ready";
    // **The next look is set whatever this one meets**, so one error never stops the page.
    const loop = async () => {
      try { await look(); } catch (_) { /* look says its own errors */ }
      setTimeout(loop, LOOK_MS);
    };
    setTimeout(loop, LOOK_MS);
  }

  $("ask").addEventListener("submit", (e) => {
    e.preventDefault();
    const text = $("text").value.trim();
    if (text === "") return;
    $("text").value = "";
    ask(text);
  });
  $("text").addEventListener("keydown", (e) => {
    // **Enter during composition confirms the Japanese input**, and asks nothing.
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing && e.keyCode !== 229) {
      e.preventDefault();
      $("ask").requestSubmit();
    }
  });
  $("new").addEventListener("click", () => open(newName()));
  $("latest").addEventListener("click", () => { $("log").scrollTop = $("log").scrollHeight; });
  start();
})();
</script>
</body>
</html>
