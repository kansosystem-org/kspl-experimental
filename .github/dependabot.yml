# Dependabot proposes, once a week, the next version of what is pinned by hand. It opens a pull
# request; nothing is merged unasked. The workflows have no `pull_request` trigger, so a proposal
# runs no CI by itself: start ci.yml on its branch by hand when one matters.
#
# What it cannot see stays a hand bump: the runner images (`runs-on:` in both workflows), Node's
# version in release.yml, and in .devcontainer/Dockerfile Chromium's revision and SHA-256 (build
# arguments) and LLVM's major version (package names, which a new base release may not carry).
version: 2
updates:
  # The actions both workflows use, pinned to a commit with the tag as a comment. "/" reads only
  # the workflows; an action of this repository's own is a directory of its own.
  - package-ecosystem: "github-actions"
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
  # vsce, the tool release.yml packs the VS Code extensions with, and its tree, pinned by the
  # lockfile.
  - package-ecosystem: "npm"
    directory: "/.github/vsce"
    schedule:
      interval: "weekly"
  # The dev container's base image, pinned by digest.
  - package-ecosystem: "docker"
    directory: "/.devcontainer"
    schedule:
      interval: "weekly"
