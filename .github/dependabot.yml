# Dependabot proposes, once a week, the next version of what is pinned by hand. It opens a pull
# request; nothing is merged unasked. The workflows have no `pull_request` trigger, so a proposal
# runs no CI by itself: start ci.yml on its branch by hand when one matters.
#
# What it cannot see stays a hand bump: vsce's version in release.yml (an `npx` inside a `run:`),
# and in .devcontainer/Dockerfile Chromium's revision and SHA-256 (build arguments) and LLVM's
# major version (package names, which a new base release may not carry).
version: 2
updates:
  # The actions both workflows use, pinned to a commit with the tag as a comment.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
  # The dev container's base image, pinned by digest.
  - package-ecosystem: "docker"
    directory: "/.devcontainer"
    schedule:
      interval: "weekly"
