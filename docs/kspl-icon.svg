<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="KSPL"><title>KSPL</title><!-- The KSPL icon: a vermilion K, a bar and an opening bracket |<, written with a brush inside an ink ensō (the Zen circle in one stroke) on unbleached washi. The K is three strokes of regular script (kaisho): the bar enters as a brush lands, its tip at the upper left pressing down into a knob on the right shoulder, and ends in a stop; the upper arm enters the same way and sweeps down to the left, thinning into the bar; the lower arm starts thin, swells, and sweeps out to a point on the right. Drawn with no font. The VS Code extension's icon.png is rendered from this file. --><rect x="16" y="16" width="224" height="224" rx="44" fill="#F6F1E3"/><path d="M175.0 46.6 L179.4 48.1 L183.5 50.2 L187.4 52.6 L191.3 55.2 L195.0 58.0 L198.5 61.1 L201.9 64.3 L205.2 67.7 L208.2 71.3 L211.1 75.0 L213.8 78.9 L216.3 83.0 L218.6 87.2 L220.7 91.5 L222.6 95.9 L224.2 100.4 L225.7 105.0 L226.9 109.7 L227.8 114.4 L228.6 119.2 L229.1 124.0 L229.3 128.9 L229.3 133.8 L229.1 138.6 L228.6 143.5 L227.9 148.3 L227.0 153.1 L225.8 157.9 L224.3 162.6 L222.7 167.2 L220.8 171.8 L218.7 176.2 L216.3 180.6 L213.8 184.8 L211.0 188.9 L208.1 192.8 L204.9 196.7 L201.6 200.3 L198.1 203.8 L194.4 207.1 L190.5 210.2 L186.5 213.2 L182.4 215.9 L178.1 218.4 L173.7 220.7 L169.2 222.8 L164.6 224.7 L160.0 226.3 L155.2 227.8 L150.4 228.9 L145.5 229.9 L140.6 230.6 L135.7 231.0 L130.7 231.2 L125.7 231.2 L120.8 230.9 L115.9 230.4 L111.0 229.6 L106.2 228.6 L101.4 227.4 L96.7 225.9 L92.0 224.2 L87.5 222.3 L83.0 220.2 L78.7 217.8 L74.5 215.3 L70.5 212.5 L66.5 209.6 L62.8 206.4 L59.2 203.1 L55.7 199.6 L52.5 196.0 L49.4 192.2 L46.5 188.3 L43.9 184.2 L41.4 180.0 L39.1 175.7 L37.1 171.4 L35.3 166.9 L33.7 162.3 L32.3 157.7 L31.2 153.0 L30.3 148.3 L29.6 143.6 L29.1 138.8 L28.9 134.1 L29.0 129.3 L29.2 124.6 L29.7 119.8 L30.4 115.2 L31.4 110.5 L32.5 106.0 L33.9 101.5 L35.5 97.1 L37.4 92.8 L39.4 88.6 L41.6 84.5 L44.0 80.5 